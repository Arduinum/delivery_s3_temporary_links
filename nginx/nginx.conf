events {}

http {
    server {
        listen 443 ssl;
        server_name s3-files.arduinum628.ru;

        ssl_certificate /etc/letsencrypt/live/s3-files.arduinum628.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s3-files.arduinum628.ru/privkey.pem;

        location / {
            proxy_pass http://links_s3_app:8075;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # редирект с http на https
    server {
        listen 80;
        server_name s3-files.arduinum628.ru;

        return 301 https://$host$request_uri;
    }
}
